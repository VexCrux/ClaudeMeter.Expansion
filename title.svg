<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#2a1610">
        <animate attributeName="stop-color" values="#2a1610; #1a0a07; #2a1610" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- Фон с закруглением вверху -->
  <path d="M0,40 Q400,0 800,40 L800,120 L0,120 Z" fill="url(#bgGradient)" />

  <!-- Мерцающие звезды -->
  <g fill="#ffffff">
    <circle cx="15%" cy="70%" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" /></circle>
    <circle cx="85%" cy="60%" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="35%" cy="85%" r="1"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" /></circle>
    <circle cx="65%" cy="50%" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" /></circle>
  </g>
</svg>
